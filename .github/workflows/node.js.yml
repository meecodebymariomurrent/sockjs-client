# Clean install, lint, build and test across supported Node.js LTS versions,
# plus a supply-chain job (production audit, license allowlist, SBOM).
# Node.js release schedule: https://nodejs.org/en/about/releases/

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run build --if-present
    - run: npm test

  supply-chain:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
    - run: npm ci
    # Fails on any known advisory in the shipped (production) dependency tree.
    - run: npm run audit:prod
    # Fails if a production dependency uses a license outside the allowlist.
    - run: npm run licenses
    - run: npm run sbom
    - uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom.cdx.json
